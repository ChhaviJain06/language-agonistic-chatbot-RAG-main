port: 7880
rtc:
  tcp_port: 7881                 # fallback for networks that block UDP
  port_range_start: 50000
  port_range_end: 50100
  # The VM only knows its private address; LiveKit asks a STUN server for the public one
  # and advertises that to browsers. (The `onprem` air-gapped profile must not use this.)
  use_external_ip: true
# Keys come from the LIVEKIT_KEYS env var so no secret lands in the repo (C4).
logging:
  level: info
