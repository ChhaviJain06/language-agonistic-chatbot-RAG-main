port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  # 127.0.0.1 = only this computer can connect to the media server. To test the mic from a
  # phone on the same Wi-Fi, replace it with this computer's LAN IP (and add that IP to
  # infra/caddy/Caddyfile too), then restart: docker compose restart livekit caddy
  node_ip: 127.0.0.1
# Keys come from the LIVEKIT_KEYS env var so no secret lands in the repo (C4).
logging:
  level: info
